.bub.origin { background:rgba(96,165,250,0.92); border:2px solid #fff; color:#fff; font-size:12px; padding:4px 10px; cursor:default; }
.bub.dest { background:rgba(251,146,60,0.88); border:2px solid rgba(255,210,100,0.9); color:#fff; font-size:11px; padding:3px 7px; cursor:pointer; }

window.TOTALS={2:65,3:57,4:48,5:71,6:63,7:24,8:54,9:31,10:10,11:27,12:32,13:18,14:23,15:14,16:31,17:35,18:98,19:60,20:43,21:44,22:26,23:80,24:60,25:54,26:91,27:66,28:70,29:56,30:50,31:22,32:55,33:60,34:10,35:34,36:38,37:78,38:67,39:37};

const DISTRICTS=[{id:2,name:"Arnavutköy",lat:41.225,lon:28.745},{id:3,name:"Ataşehir",lat:40.990,lon:29.130},{id:4,name:"Avcılar",lat:40.980,lon:28.720},{id:5,name:"Bağcılar",lat:41.040,lon:28.855},{id:6,name:"Bahçelievler",lat:41.000,lon:28.870},{id:7,name:"Bakırköy",lat:40.970,lon:28.870},{id:8,name:"Başakşehir",lat:41.095,lon:28.800},{id:9,name:"Bayrampaşa",lat:41.060,lon:28.900},{id:10,name:"Beşiktaş",lat:41.055,lon:29.010},{id:11,name:"Beykoz",lat:41.135,lon:29.100},{id:12,name:"Beylikdüzü",lat:41.005,lon:28.640},{id:13,name:"Beyoğlu",lat:41.035,lon:28.975},{id:14,name:"Büyükçekmece",lat:41.020,lon:28.585},{id:15,name:"Çatalca",lat:41.145,lon:28.460},{id:16,name:"Çekmeköy",lat:41.020,lon:29.185},{id:17,name:"Esenler",lat:41.045,lon:28.875},{id:18,name:"Esenyurt",lat:41.015,lon:28.675},{id:19,name:"Eyüpsultan",lat:41.085,lon:28.935},{id:20,name:"Fatih",lat:41.015,lon:28.950},{id:21,name:"Gaziosmanpaşa",lat:41.070,lon:28.915},{id:22,name:"Güngören",lat:41.020,lon:28.875},{id:23,name:"Kadıköy",lat:40.990,lon:29.025},{id:24,name:"Kağıthane",lat:41.085,lon:28.970},{id:25,name:"Kartal",lat:40.905,lon:29.185},{id:26,name:"Küçükçekmece",lat:41.000,lon:28.775},{id:27,name:"Maltepe",lat:40.940,lon:29.130},{id:28,name:"Pendik",lat:40.875,lon:29.230},{id:29,name:"Sancaktepe",lat:40.980,lon:29.235},{id:30,name:"Sarıyer",lat:41.165,lon:29.000},{id:31,name:"Silivri",lat:41.075,lon:28.245},{id:32,name:"Sultanbeyli",lat:40.950,lon:29.265},{id:33,name:"Sultangazi",lat:41.110,lon:28.870},{id:34,name:"Şile",lat:41.175,lon:29.615},{id:35,name:"Şişli",lat:41.060,lon:28.990},{id:36,name:"Tuzla",lat:40.815,lon:29.310},{id:37,name:"Ümraniye",lat:41.015,lon:29.120},{id:38,name:"Üsküdar",lat:41.025,lon:29.025},{id:39,name:"Zeytinburnu",lat:40.995,lon:28.910}];

const map=L.map('map',{center:[41.02,28.97],zoom:10});
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles © Esri',maxZoom:18}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{attribution:'',maxZoom:18,opacity:0.5}).addTo(map);

const arcLayer=L.layerGroup().addTo(map);
let currentId=null;

DISTRICTS.forEach(d=>{
  const icon=L.divIcon({
    className:'',
    html:'<div class="bub" id="bub-'+d.id+'" onclick="showDistrict('+d.id+')">'+d.name+'</div>',
    iconAnchor:[22,11]
  });
  L.marker([d.lat,d.lon],{icon}).addTo(map);
});

function showDistrict(id){
  if(currentId===id){
    currentId=null;
    arcLayer.clearLayers();
    resetAll();
    document.getElementById('title').textContent='Istanbul Commute Flows — click any district';
    document.getElementById('subtitle').textContent='2026 Istanbul Household Travel Survey · 1,793 respondents · click a bubble to see where residents go to work';
    return;
  }
  currentId=id;
  const d=DISTRICTS.find(x=>x.id===id);
  const rows=OD[id]||{};
  const total=TOTALS[id]||0;
  const totalW=TOTALS_W[id]||0;
  const stay=rows[id]||0;
  const stayPct=(stay/total*100).toFixed(0);
  const outFlows=Object.entries(rows).filter(([k,v])=>+k!==id&&v>0);
  const maxFlow=outFlows.length?Math.max(...outFlows.map(([,v])=>v)):1;

  document.getElementById('title').textContent=d.name+' — Where do residents go to work?';
  document.getElementById('subtitle').textContent=totalW.toLocaleString()+' workers (weighted) · '+stayPct+'% work locally · '+(100-+stayPct)+'% commute out · click same to reset';

  arcLayer.clearLayers();

  DISTRICTS.forEach(dist=>{
    const el=document.getElementById('bub-'+dist.id);
    if(!el)return;
    if(dist.id===id){
      el.className='bub origin';
      el.textContent=stayPct+'% stay';
    } else {
      const flow=rows[dist.id]||0;
      const share=total>0?(flow/total*100):0;
      if(share>=1){
        el.className='bub dest';
        el.textContent=dist.name+' '+share.toFixed(0)+'%';
      } else {
        el.className='bub';
        el.textContent=dist.name;
      }
    }
  });

  outFlows.forEach(([toId,val])=>{
    const toD=DISTRICTS.find(x=>x.id===+toId);
    if(!toD)return;
    const w=Math.max(2,(val/maxFlow)*10);
    const alpha=0.4+0.5*(val/maxFlow);
    const mLat=(d.lat+toD.lat)/2+(toD.lon-d.lon)*0.2;
    const mLon=(d.lon+toD.lon)/2-(toD.lat-d.lat)*0.2;
    const pct=(val/total*100).toFixed(0);
    L.curve(['M',[d.lat,d.lon],'Q',[mLat,mLon],[toD.lat,toD.lon]],
      {color:'rgba(251,146,60,'+alpha+')',weight:w,fill:false,opacity:1})
      .addTo(arcLayer)
      .bindTooltip(toD.name+': '+pct+'% ('+val+' obs)',{sticky:true,opacity:0.95});
  });
}

function resetAll(){
  DISTRICTS.forEach(d=>{
    const el=document.getElementById('bub-'+d.id);
    if(!el)return;
    el.className='bub';
    el.textContent=d.name;
  });
}

showDistrict(38);
</script>
